name: Prototype builds
on:
 push:
  branches: [main]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 test:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version: '1.25.3'
   - run: go test -race -count=1 ./...
   - run: go vet ./...
 binaries:
  needs: test
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version: '1.25.3'
   - run: bash scripts/build-binaries.sh
   - uses: actions/upload-artifact@v4
     with:
      name: multidns-linux-binaries
      path: dist/
      retention-days: 30
 android:
  needs: test
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version: '1.25.3'
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
   - run: bash scripts/build-android.sh
   - run: cd android && ./gradlew --no-daemon testDebugUnitTest
   - uses: actions/upload-artifact@v4
     with:
      name: multidns-android-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 30
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: android-lint-report
      path: android/app/build/reports/lint-results-debug.html
